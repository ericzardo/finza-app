openapi: 3.0.3
info:
  title: Finza - Environment Variables
  version: 1.0.0
  description: >-
    Documentação das variáveis de ambiente esperadas pelo pacote `@finza/api`.

components:
  schemas:
    Env:
      type: object
      properties:
        NODE_ENV:
          type: string
          description: 'Ambiente de execução (dev, prod, stage, test)'
          example: dev
        PORT:
          type: integer
          description: 'Porta em que a API deve escutar'
          example: 9999
        HOST:
          type: string
          description: 'Endereço de escuta (host)'
          example: 0.0.0.0
        DATABASE_URL:
          type: string
          description: 'Connection string do Postgres (DATABASE_URL)'
        DIRECT_URL:
          type: string
          description: 'Connection string direta para operações de migração/CLI (DIRECT_URL)'
        APP_URL:
          type: string
          format: uri
          description: 'URL pública da aplicação'
          example: 'http://localhost:3000'
        JWT_SECRET:
          type: string
          description: 'Segredo para assinatura de JWT (mínimo 8 caracteres)'
        RESEND_API_KEY:
          type: string
          description: 'Chave opcional do serviço Resend para envio de emails'
      required:
        - DATABASE_URL
        - DIRECT_URL
        - JWT_SECRET

paths: {}
