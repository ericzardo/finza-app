services:
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    ports:
      - "9999:9999"
    env_file:
      - packages/api/.env.dev
    restart: unless-stopped
    networks:
      - finza-net

  dashboard:
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:9999}
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost:5173}
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - finza-net

networks:
  finza-net:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.20.0.0/16
        - subnet: fd00:dead:beef::/48
