name: CI

on:
  pull_request:
    branches: [staging, main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://placeholder:5432/db"
      DIRECT_URL: "postgresql://placeholder:5432/db"
      JWT_SECRET: "placeholder_secret_minimum_8"

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install

      - name: Gerar Prisma Client
        run: bunx prisma generate
        working-directory: packages/api

      - name: Rodar testes da API
        run: bun run test
        working-directory: packages/api