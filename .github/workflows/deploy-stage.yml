name: Deploy Stage

on:
  push:
    branches: [staging]

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}/api
  IMAGE_DASHBOARD: ghcr.io/${{ github.repository }}/dashboard

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/api/Dockerfile
          push: true
          build-args: |
            DATABASE_URL=postgresql://placeholder:5432/db
            DIRECT_URL=postgresql://placeholder:5432/db
            JWT_SECRET=placeholder_secret_minimum_8
          tags: |
            ${{ env.IMAGE_API }}:stage
            ${{ env.IMAGE_API }}:stage-${{ github.sha }}

      - name: Build e push do Dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/dashboard/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=https://api.stage.finza.zardo.dev
            VITE_APP_URL=https://stage.finza.zardo.dev
          tags: |
            ${{ env.IMAGE_DASHBOARD }}:stage
            ${{ env.IMAGE_DASHBOARD }}:stage-${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /srv/finza
            git pull origin staging
            docker compose -f infra/docker-compose.stage.yml pull
            docker compose -f infra/docker-compose.stage.yml up -d
            docker image prune -f